services:
  openplc-runtime:
    image: ghcr.io/autonomy-logic/openplc-runtime@sha256:378deec33b371eb09f8344e714d88b48efc7387f631f793371ba9f6a6e381c9f
    platform: linux/amd64
    container_name: openplc-runtime
    ports:
      - "127.0.0.1:1502:1502"
      - "127.0.0.1:8443:8443"
    volumes:
      - openplc-runtime-data:/var/run/runtime
    cap_add:
      - SYS_NICE
      - SYS_RESOURCE
    restart: "no"
    logging:
      driver: local

volumes:
  openplc-runtime-data:
    name: openplc-runtime-data
